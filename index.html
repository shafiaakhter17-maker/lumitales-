<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d99da7">

<title>LumiTales 🌷</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f8f2ed;
  color:#51433f;
  font-family:Arial,sans-serif;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

header{
  text-align:center;
  padding:35px 10px;
}

h1{
  font-family:Georgia,serif;
  font-size:44px;
  margin:0;
}

.subtitle{
  color:#867774;
  margin-top:10px;
}

.search{
  width:100%;
  padding:15px;
  border:1px solid #eaded7;
  border-radius:18px;
  background:white;
  font-size:16px;
  outline:none;
}

.languages{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:20px 0;
}

.languages button{
  border:1px solid #eaded7;
  background:white;
  padding:10px 14px;
  border-radius:20px;
  cursor:pointer;
}

.languages button.active{
  background:#d99da7;
  color:white;
}

h2{
  font-family:Georgia,serif;
}

.stories{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:18px;
}

.card{
  background:#fffaf7;
  border:1px solid #eaded7;
  border-radius:24px;
  padding:22px;
  box-shadow:0 8px 25px rgba(80,60,55,.08);
}

.card h3{
  font-family:Georgia,serif;
  font-size:25px;
}

.card p{
  color:#867774;
  line-height:1.6;
}

.read{
  background:#d99da7;
  color:white;
  border:0;
  padding:11px 17px;
  border-radius:14px;
  cursor:pointer;
}

.level{
  background:#efd0d3;
  padding:6px 10px;
  border-radius:10px;
  font-size:12px;
}

.bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:18px;
}

.reader{
  display:none;
  position:fixed;
  inset:0;
  overflow:auto;
  background:#f8f2ed;
  z-index:10;
}

.reader.open{
  display:block;
}

.reader-content{
  max-width:800px;
  margin:auto;
  padding:25px;
}

.back{
  border:1px solid #eaded7;
  background:white;
  padding:10px 15px;
  border-radius:14px;
  cursor:pointer;
}

.story{
  background:white;
  border-radius:24px;
  padding:25px;
  margin-top:20px;
  line-height:1.9;
  font-size:18px;
}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}

.controls button{
  border:1px solid #eaded7;
  background:white;
  padding:9px 13px;
  border-radius:12px;
  cursor:pointer;
}

.vocab{
  margin-top:20px;
}

.word{
  background:#fffaf7;
  padding:12px;
  border-radius:12px;
  margin:8px 0;
}

footer{
  text-align:center;
  color:#867774;
  padding:40px;
}

@media(max-width:600px){
  h1{
    font-size:36px;
  }

  .container{
    padding:14px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>LumiTales 🌷</h1>
  <div class="subtitle">
    Stories that teach · Languages that stay
  </div>
</header>

<input
  class="search"
  id="search"
  placeholder="Search stories..."
  oninput="showStories()"
>

<h2>Choose your language 🌍</h2>

<div class="languages" id="languages"></div>

<h2>Stories 📖</h2>

<div class="stories" id="stories"></div>

<footer>
  Made with 🌷 for language learners
</footer>

</div>


<div class="reader" id="reader">

<div class="reader-content">

<button class="back" onclick="closeStory()">← Back</button>

<h1 id="readerTitle"></h1>

<p id="readerLevel"></p>

<div class="controls">

<button onclick="changeSize(1)">A+</button>

<button onclick="changeSize(-1)">A−</button>

<button onclick="readStory()">🔊 Read</button>

<button onclick="stopReading()">⏹ Stop</button>

</div>

<div class="story">

<h2>📖 Story</h2>

<p id="storyText"></p>

</div>

<div class="story">

<h2>🇬🇧 English Translation</h2>

<p id="englishText"></p>

</div>

<div class="story">

<h2>✨ Vocabulary</h2>

<div id="vocabulary"></div>

</div>

</div>

</div>

function setupLanguages(){

  const box=document.getElementById("languages");

  box.innerHTML="";

  for(const language in languages){

    const button=document.createElement("button");

    button.innerText=languages[language]+" "+language;

    if(language===currentLanguage){
      button.classList.add("active");
    }

    button.onclick=function(){

      currentLanguage=language;

      setupLanguages();

      showStories();

    };

    box.appendChild(button);

  }

}


function showStories(){

  const box=document.getElementById("stories");

  const search=
    document.getElementById("search")
    .value
    .toLowerCase();

  box.innerHTML="";

  stories.forEach((story,index)=>{

    const item=story.data[currentLanguage];

    if(
      !item.title.toLowerCase().includes(search) &&
      !story.description.toLowerCase().includes(search)
    ){
      return;
    }

    const card=document.createElement("div");

    card.className="card";

    card.innerHTML=`

      <small>TALE ${index+1}</small>

      <h3>${item.title}</h3>

      <p>${story.description}</p>

      <div class="bottom">

        <span class="level">
          ${story.level}
        </span>

        <button
          class="read"
          onclick="openStory(${index})">
          Read →
        </button>

      </div>

    `;

    box.appendChild(card);

  });

}


function openStory(index){

  currentStory=index;

  const story=stories[index];

  const item=story.data[currentLanguage];

  document.getElementById("readerTitle").innerText=
    item.title;

  document.getElementById("readerLevel").innerText=
    currentLanguage+" · "+story.level;

  document.getElementById("storyText").innerText=
    item.text;

  document.getElementById("englishText").innerText=
    story.data.English.text;

  const vocab=
    document.getElementById("vocabulary");

  vocab.innerHTML="";

  item.words.forEach(word=>{

    const div=document.createElement("div");

    div.className="word";

    div.innerHTML=
      "<strong>"+word[0]+"</strong><br>"+
      word[1];

    vocab.appendChild(div);

  });

  document.getElementById("reader").classList.add("open");

}


function closeStory(){

  stopReading();

  document.getElementById("reader")
    .classList.remove("open");

}


function changeSize(amount){

  textSize+=amount;

  if(textSize<14) textSize=14;

  if(textSize>28) textSize=28;

  document.getElementById("storyText")
    .style.fontSize=textSize+"px";

}


function readStory(){

  if(!window.speechSynthesis){

    alert("Read aloud is not supported on this browser.");

    return;

  }

  stopReading();

  const speech=
    new SpeechSynthesisUtterance(
      document.getElementById("storyText").innerText
    );

  const voiceLanguages={

    English:"en-US",
    Japanese:"ja-JP",
    Korean:"ko-KR",
    Spanish:"es-ES",
    French:"fr-FR",
    German:"de-DE",
    Italian:"it-IT",
    Hindi:"hi-IN",
    Arabic:"ar-SA"

  };

  speech.lang=voiceLanguages[currentLanguage];

  speech.rate=.9;

  speechSynthesis.speak(speech);

}


function stopReading(){

  if(window.speechSynthesis){

    speechSynthesis.cancel();

  }

}


setupLanguages();

showStories();

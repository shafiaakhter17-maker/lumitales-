<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d99da7">
<link rel="manifest" href="manifest.json">

<title>LumiTales 🌷</title>

<style>
:root{
  --bg:#f8f2ed;
  --card:#fffaf7;
  --text:#51433f;
  --muted:#867774;
  --pink:#d99da7;
  --line:#eaded7;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

body.dark{
  --bg:#292627;
  --card:#383233;
  --text:#f8efeb;
  --muted:#c9bbb6;
  --line:#514646;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.wrap{
  max-width:950px;
  margin:auto;
  padding:22px 16px 55px;
}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:38px;
}

.logo{
  font-family:Georgia,serif;
  font-size:29px;
  font-weight:bold;
}

.logo span,
h1 span{
  color:var(--pink);
}

.round{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--card);
  color:var(--text);
}

.hero{
  text-align:center;
}

.kicker{
  font-size:12px;
  letter-spacing:3px;
  color:#9b8079;
}

.hero h1{
  font-family:Georgia,serif;
  font-size:clamp(45px,9vw,75px);
  line-height:.92;
  margin:18px 0;
}

.hero p{
  max-width:650px;
  margin:20px auto 25px;
  color:var(--muted);
  font-size:17px;
  line-height:1.65;
}

.search{
  width:100%;
  padding:18px 21px;
  border:1px solid var(--line);
  border-radius:40px;
  background:var(--card);
  color:var(--text);
  outline:0;
}

.langs{
  display:flex;
  gap:9px;
  overflow:auto;
  padding:16px 1px 25px;
}

.lang{
  white-space:nowrap;
  padding:11px 16px;
  border-radius:25px;
  background:var(--card);
  color:var(--text);
  border:1px solid var(--line);
}

.lang.active{
  background:var(--pink);
  color:white;
}

.feature{
  padding:28px;
  border-radius:28px;
  background:linear-gradient(135deg,#ead2d1,#dce5d8);
  margin:8px 0 38px;
}

.feature h2{
  font-family:Georgia,serif;
  font-size:37px;
  margin:12px 0;
}

.feature p{
  line-height:1.6;
}

.primary{
  padding:12px 18px;
  border-radius:25px;
  font-weight:bold;
  background:white;
  color:#554742;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:end;
}

.head h2{
  font-family:Georgia,serif;
  font-size:39px;
  margin:0 0 15px;
}

.count{
  font-size:13px;
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:17px;
}

.story{
  background:var(--card);
  padding:21px;
  border:1px solid var(--line);
  border-radius:25px;
  min-height:245px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.top,
.foot{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.emoji{
  font-size:28px;
}

.fav{
  background:none;
  color:var(--pink);
  font-size:25px;
}

.slang{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.5px;
  color:#a07876;
  margin-top:13px;
}

.story h3{
  font-family:Georgia,serif;
  font-size:29px;
  margin:7px 0;
}

.story p{
  color:var(--muted);
  line-height:1.5;
}

.level{
  font-size:11px;
  padding:7px 10px;
  border-radius:15px;
  background:#edf0e9;
}

.open{
  padding:12px 18px;
  border-radius:25px;
  font-weight:bold;
  background:var(--text);
  color:var(--bg);
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:45px;
}

.reader{
  position:fixed;
  inset:0;
  background:#241f1e99;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:5;
}

.reader.show{
  display:flex;
}

.box{
  width:min(720px,100%);
  max-height:92vh;
  overflow:auto;
  background:var(--card);
  border-radius:28px;
  padding:24px;
}

.rhead{
  display:flex;
  justify-content:space-between;
}

.close{
  width:40px;
  height:40px;
  border-radius:50%;
  background:var(--bg);
  color:var(--text);
  font-size:22px;
}

.box h2{
  font-family:Georgia,serif;
  font-size:42px;
}

.tools{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.tool{
  padding:9px 13px;
  border-radius:18px;
  background:var(--bg);
  color:var(--text);
}

.original{
  font-size:19px;
  line-height:1.9;
  white-space:pre-line;
  padding:20px 0;
  border-bottom:1px solid var(--line);
}

.translation{
  color:var(--muted);
  line-height:1.7;
  white-space:pre-line;
}

.vocab{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:8px;
}

.word{
  background:var(--bg);
  padding:10px;
  border-radius:13px;
}

.word small{
  color:var(--muted);
}

footer{
  text-align:center;
  color:var(--muted);
  margin-top:50px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="wrap">

<div class="nav">
  <div class="logo">
    Lumi<span>Tales</span> ✦
  </div>

  <button class="round" onclick="theme()">☾</button>
</div>


<section class="hero">

<div class="kicker">
STORIES FOR LANGUAGE LEARNERS
</div>

<h1>
Read a little.<br>
<span>Learn a lot.</span>
</h1>

<p>
Original little stories in beautiful languages,
with gentle English translations to help you learn naturally.
</p>

<input
id="search"
class="search"
placeholder="⌕  Search stories..."
oninput="render()">

</section>


<div id="langs" class="langs"></div>


<section class="feature">

<small>✦ STORY OF THE DAY</small>

<h2 id="ft"></h2>

<p id="fd"></p>

<button class="primary" onclick="openStory(0)">
Read story →
</button>

</section>


<div class="head">

<h2>
Explore stories
</h2>

<span id="count" class="count"></span>

</div>


<div id="stories" class="grid"></div>


<footer>
Made with little stories and big curiosity 🌷
</footer>

</div>


<div
id="reader"
class="reader"
onclick="if(event.target===this)closeStory()">

<div class="box">

<div class="rhead">

<span id="rlang"></span>

<button class="close" onclick="closeStory()">
×
</button>

</div>


<h2 id="rt"></h2>


<div class="tools">

<button class="tool" onclick="size(-1)">
A−
</button>

<button class="tool" onclick="size(1)">
A+
</button>

<button class="tool" onclick="listen()">
🔊 Listen
</button>

</div>


<div id="original" class="original"></div>


<h3>
English translation
</h3>

<div id="translation" class="translation"></div>


<h3>
Vocabulary
</h3>

<div id="vocab" class="vocab"></div>

</div>
</div>

let selectedLanguage="English";
let currentStory=0;
let fontSize=19;


function setupLanguages(){

const box=document.getElementById("langs");

box.innerHTML=languages.map(x=>`

<button
class="lang ${x[0]==="English"?"active":""}"
onclick="chooseLanguage('${x[0]}',this)">

${x[1]} ${x[0]}

</button>

`).join("");

}


function chooseLanguage(language,button){

selectedLanguage=language;

document
.querySelectorAll(".lang")
.forEach(b=>b.classList.remove("active"));

button.classList.add("active");

render();

}


function render(){

const query=
document.getElementById("search")
.value
.toLowerCase()
.trim();


const filtered=stories.filter(story=>{

const title=
story.translations[selectedLanguage].title
.toLowerCase();

return title.includes(query) ||
story.description.toLowerCase().includes(query);

});


document.getElementById("count").textContent=
filtered.length+" stories";


document.getElementById("ft").textContent=
stories[0].translations[selectedLanguage].title;

document.getElementById("fd").textContent=
stories[0].description;


const container=
document.getElementById("stories");


if(filtered.length===0){

container.innerHTML=`
<div class="empty">
🌷<br><br>
No stories found.
</div>
`;

return;

}


container.innerHTML=

filtered.map(story=>{

const index=stories.indexOf(story);

return `

<article class="story">

<div>

<div class="top">

<div class="emoji">
${story.emoji}
</div>

<button
class="fav"
onclick="toggleFavorite(${index})">

${isFavorite(index)?"♥":"♡"}

</button>

</div>


<div class="slang">
${selectedLanguage}
</div>


<h3>
${story.translations[selectedLanguage].title}
</h3>


<p>
${story.description}
</p>

</div>


<div class="foot">

<span class="level">
${story.level}
</span>

<button
class="open"
onclick="openStory(${index})">

Read →

</button>

</div>

</article>

`;

}).join("");

}


function openStory(index){

currentStory=index;

const story=stories[index];
const translation=
story.translations[selectedLanguage];

document.getElementById("rt").textContent=
translation.title;

document.getElementById("rlang").textContent=
selectedLanguage+" • "+story.level;

document.getElementById("original").textContent=
translation.text;

document.getElementById("translation").textContent=
story.translations.English.text;


document.getElementById("vocab").innerHTML=

story.vocab.map(word=>`

<div class="word">

<b>${word[0]}</b>

<br>

<small>
${word[1]}
</small>

</div>

`).join("");


document.getElementById("reader")
.classList.add("show");

document.body.style.overflow="hidden";

}


function closeStory(){

document.getElementById("reader")
.classList.remove("show");

document.body.style.overflow="";

if("speechSynthesis" in window){

speechSynthesis.cancel();

}

}


function size(change){

fontSize+=change;

if(fontSize<15) fontSize=15;

if(fontSize>28) fontSize=28;

document.getElementById("original")
.style.fontSize=fontSize+"px";

}

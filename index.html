<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d99da7">
<link rel="manifest" href="manifest.json">

<title>LumiTales 🌷</title>

<style>
:root{
  --bg:#f8f2ed;
  --card:#fffaf7;
  --text:#51433f;
  --muted:#867774;
  --pink:#d99da7;
  --pink2:#efd0d3;
  --green:#aab9a5;
  --line:#eaded7;
  --shadow:0 10px 30px rgba(80,60,55,.08);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  transition:.3s;
}

body.dark{
  --bg:#292627;
  --card:#383233;
  --text:#f8efeb;
  --muted:#c9bbb6;
  --line:#514747;
  --shadow:0 10px 30px rgba(0,0,0,.2);
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

/* HEADER */

header{
  text-align:center;
  padding:35px 10px 20px;
}

.logo{
  font-family:Georgia,serif;
  font-size:42px;
  margin:0;
  color:var(--text);
}

.tagline{
  color:var(--muted);
  margin:8px 0 20px;
}

.header-buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.icon-btn{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  border-radius:50%;
  width:42px;
  height:42px;
  box-shadow:var(--shadow);
}

/* SEARCH */

.search{
  width:100%;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  padding:14px 18px;
  border-radius:18px;
  outline:none;
  margin:10px 0 18px;
}

.search:focus{
  border-color:var(--pink);
}

/* LANGUAGES */

.section-title{
  font-family:Georgia,serif;
  font-size:22px;
  margin:20px 0 12px;
}

.languages{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.lang{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  padding:9px 13px;
  border-radius:20px;
  transition:.2s;
}

.lang.active{
  background:var(--pink);
  color:white;
  border-color:var(--pink);
}

/* STORIES */

.stories{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:18px;
}

.story-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:25px;
  padding:22px;
  box-shadow:var(--shadow);
  transition:.2s;
}

.story-card:hover{
  transform:translateY(-3px);
}

.story-number{
  font-size:13px;
  color:var(--muted);
}

.story-title{
  font-family:Georgia,serif;
  font-size:25px;
  margin:8px 0;
}

.story-description{
  color:var(--muted);
  line-height:1.5;
  font-size:14px;
}

.card-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:18px;
}

.level{
  background:var(--pink2);
  color:var(--text);
  padding:6px 10px;
  border-radius:12px;
  font-size:12px;
}

.open-btn{
  border:0;
  background:var(--pink);
  color:white;
  padding:9px 14px;
  border-radius:14px;
}

.favorite{
  border:0;
  background:transparent;
  font-size:22px;
  color:var(--muted);
}

.favorite.active{
  color:#d46c7a;
}

/* READER */

.reader{
  display:none;
  position:fixed;
  inset:0;
  background:var(--bg);
  overflow-y:auto;
  z-index:10;
}

.reader.show{
  display:block;
}

.reader-inner{
  max-width:800px;
  margin:auto;
  padding:25px 20px 50px;
}

.close-btn{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  padding:9px 14px;
  border-radius:14px;
}

.reader-title{
  font-family:Georgia,serif;
  font-size:38px;
  margin:25px 0 5px;
}

.reader-meta{
  color:var(--muted);
  margin-bottom:20px;
}

.reading-controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.control{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  padding:9px 13px;
  border-radius:13px;
}

.story-box{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:25px;
  padding:25px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
}

.box-title{
  font-family:Georgia,serif;
  font-size:20px;
  margin-top:0;
}

.story-text{
  line-height:1.9;
  font-size:18px;
  white-space:pre-line;
}

.vocab{
  display:grid;
  gap:10px;
}

.word{
  background:var(--bg);
  border-radius:14px;
  padding:12px;
}

.word strong{
  display:block;
  margin-bottom:4px;
}

.empty{
  text-align:center;
  padding:40px;
  color:var(--muted);
}

/* FOOTER */

footer{
  text-align:center;
  color:var(--muted);
  padding:40px 10px 20px;
  font-size:13px;
}

@media(max-width:600px){
  .app{
    padding:14px;
  }

  .logo{
    font-size:35px;
  }

  .reader-title{
    font-size:30px;
  }

  .story-text{
    font-size:16px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1 class="logo">LumiTales 🌷</h1>
  <p class="tagline">Stories that teach · Languages that stay</p>

  <div class="header-buttons">
    <button class="icon-btn" onclick="toggleDark()" title="Dark mode">🌙</button>
    <button class="icon-btn" onclick="showFavorites()" title="Favorites">♡</button>
  </div>
</header>

<input
  id="search"
  class="search"
  type="text"
  placeholder="Search stories..."
  oninput="renderStories()"
>

<h2 class="section-title">Choose a language 🌍</h2>

<div class="languages" id="languages"></div>

<h2 class="section-title">Today's tales 📖</h2>

<div class="stories" id="stories"></div>

<footer>
  Made with 🌷 for language learners
</footer>

</div>


<!-- READER -->

<div class="reader" id="reader">

  <div class="reader-inner">

    <button class="close-btn" onclick="closeReader()">← Back</button>

    <h1 class="reader-title" id="readerTitle"></h1>

    <div class="reader-meta" id="readerMeta"></div>

    <div class="reading-controls">
      <button class="control" onclick="changeFont(1)">A+</button>
      <button class="control" onclick="changeFont(-1)">A−</button>
      <button class="control" onclick="speakStory()">🔊 Read aloud</button>
      <button class="control" onclick="stopSpeaking()">⏹ Stop</button>
      <button class="control" onclick="toggleReaderFavorite()">♡ Favorite</button>
    </div>

    <div class="story-box">
      <h2 class="box-title">📖 Story</h2>
      <div class="story-text" id="storyText"></div>
    </div>

    <div class="story-box">
      <h2 class="box-title">🇬🇧 English Translation</h2>
      <div class="story-text" id="translationText"></div>
    </div>

    <div class="story-box">
      <h2 class="box-title">✨ Vocabulary</h2>
      <div class="vocab" id="vocabulary"></div>
    </div>

  </div>

</div>

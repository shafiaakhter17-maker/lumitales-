<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d99da7">
<title>LumiTales 🌷</title>

<style>
*{box-sizing:border-box}

:root{
 --bg:#f8f2ed;
 --card:#fffaf7;
 --text:#51433f;
 --muted:#867774;
 --pink:#d99da7;
 --soft:#efd0d3;
 --line:#eaded7;
}

body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,sans-serif;
}

.container{
 max-width:1000px;
 margin:auto;
 padding:18px;
}

header{
 text-align:center;
 padding:35px 10px 25px;
}

.logo{
 font-family:Georgia,serif;
 font-size:45px;
 margin:0;
}

.subtitle{
 color:var(--muted);
 margin:10px 0 20px;
}

.header-buttons{
 display:flex;
 justify-content:center;
 gap:8px;
}

.header-buttons button,
.controls button,
.back{
 border:1px solid var(--line);
 background:var(--card);
 color:var(--text);
 padding:10px 14px;
 border-radius:14px;
 cursor:pointer;
}

.header-buttons button{
 border-radius:50%;
 width:42px;
 height:42px;
}

.search{
 width:100%;
 padding:15px 18px;
 border:1px solid var(--line);
 border-radius:18px;
 background:var(--card);
 color:var(--text);
 outline:none;
 font-size:16px;
}

.section-title{
 font-family:Georgia,serif;
 margin:25px 0 12px;
}

.languages{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
}

.languages button{
 border:1px solid var(--line);
 background:var(--card);
 color:var(--text);
 padding:10px 14px;
 border-radius:20px;
 cursor:pointer;
}

.languages button.active{
 background:var(--pink);
 color:white;
}

.stories{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
 gap:18px;
}

.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:24px;
 padding:22px;
 box-shadow:0 8px 25px rgba(80,60,55,.08);
}

.card-number{
 color:var(--muted);
 font-size:12px;
}

.card h3{
 font-family:Georgia,serif;
 font-size:25px;
 margin:9px 0;
}

.card p{
 color:var(--muted);
 line-height:1.6;
}

.bottom{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-top:20px;
}

.level{
 background:var(--soft);
 padding:6px 10px;
 border-radius:10px;
 font-size:12px;
}

.read{
 border:0;
 background:var(--pink);
 color:white;
 padding:10px 16px;
 border-radius:14px;
 cursor:pointer;
}

.empty{
 text-align:center;
 padding:40px;
 color:var(--muted);
}

footer{
 text-align:center;
 color:var(--muted);
 padding:45px 10px 20px;
}

.reader{
 display:none;
 position:fixed;
 inset:0;
 background:var(--bg);
 overflow-y:auto;
 z-index:20;
}

.reader.open{
 display:block;
}

.reader-content{
 max-width:820px;
 margin:auto;
 padding:25px 20px 60px;
}

.reader-title{
 font-family:Georgia,serif;
 font-size:40px;
 margin:25px 0 5px;
}

.reader-meta{
 color:var(--muted);
}

.controls{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin:20px 0;
}

.story-box{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:24px;
 padding:24px;
 margin:18px 0;
}

.story-box h2{
 font-family:Georgia,serif;
}

.story-text{
 line-height:1.9;
 font-size:18px;
 white-space:pre-line;
}

.word{
 background:var(--bg);
 border-radius:13px;
 padding:12px;
 margin:8px 0;
}

.word strong{
 display:block;
 margin-bottom:4px;
}

@media(max-width:600px){
 .logo{font-size:36px}
 .reader-title{font-size:31px}
 .story-text{font-size:17px}
}
</style>
</head>

<body>

<div class="container">

<header>
<h1 class="logo">LumiTales 🌷</h1>
<p class="subtitle">Stories that teach · Languages that stay</p>

<div class="header-buttons">
<button onclick="toggleDark()">🌙</button>
<button onclick="showFavorites()">♡</button>
</div>
</header>

<input
 id="search"
 class="search"
 placeholder="Search stories..."
 oninput="renderStories()"
>

<h2 class="section-title">Choose your language 🌍</h2>

<div id="languages" class="languages"></div>

<h2 class="section-title">Explore the tales 📖</h2>

<div id="stories" class="stories"></div>

<footer>
LumiTales 🌷 · Learn through stories
</footer>

</div>


<div id="reader" class="reader">

<div class="reader-content">

<button class="back" onclick="closeStory()">← Back</button>

<h1 id="readerTitle" class="reader-title"></h1>

<p id="readerMeta" class="reader-meta"></p>

<div class="controls">
<button onclick="changeFont(1)">A+</button>
<button onclick="changeFont(-1)">A−</button>
<button onclick="readStory()">🔊 Read aloud</button>
<button onclick="stopReading()">⏹ Stop</button>
</div>

<div class="story-box">
<h2>📖 Story</h2>
<p id="storyText" class="story-text"></p>
</div>

<div class="story-box">
<h2>🇬🇧 English Translation</h2>
<p id="englishText" class="story-text"></p>
</div>

<div class="story-box">
<h2>✨ Vocabulary</h2>
<div id="vocabulary"></div>
</div>

</div>
</div>
